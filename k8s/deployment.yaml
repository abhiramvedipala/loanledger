apiVersion: apps/v1
kind: Deployment
metadata:
  name: loanledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loanledger
  template:
    metadata:
      labels:
        app: loanledger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: loanledger
          image: loanledger:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: loanledger
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loanledger-db
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
